name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://streamlint_user:ci_only_password@localhost:5432/streamlint_db
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGINS: http://localhost:5173
      TASK_BACKEND: inprocess
      GEMINI_API_KEY: ci-fake-key
      GEMINI_MODEL: ci-fake-model
      TURNSTILE_SECRET: 1x0000000000000000000000000000000AA   # Cloudflare's always-pass test secret

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: streamlint_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: streamlint_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamlint_user -d streamlint_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint with ruff
        run: ruff check backend/

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run tests
        working-directory: backend
        run: pytest || [ $? -eq 5 ]

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA   # Cloudflare's always-pass test site key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Unit tests
        # Skipped automatically if you have no "test" script yet.
        run: npm test --if-present -- --run --passWithNoTests

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image (no push)
        if: ${{ hashFiles('backend/Dockerfile') != '' }}
        run: docker build -t streamlint-backend ./backend

      - name: Note when there is no Dockerfile yet
        if: ${{ hashFiles('backend/Dockerfile') == '' }}
        run: echo "No backend/Dockerfile yet, skipping the Docker build."

  health-check:
    needs: [backend, frontend, docker] # Only run if the other jobs pass
    runs-on: ubuntu-latest
    steps:
    - name: Check Live Backend Health
      run: |
        echo "Waiting for Render to wake up..."
        sleep 60
        curl -f https://streamlint-backend.onrender.com/health/ || exit 1
        echo "✅ Live backend is healthy!"