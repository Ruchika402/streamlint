name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: streamlint_user
          POSTGRES_PASSWORD: 8697
          POSTGRES_DB: streamlint_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        
    - name: Lint with ruff
      run: ruff check backend/
      
    - name: Run Django checks
      env:
        SECRET_KEY: ci-test-secret
        DEBUG: False
        DATABASE_URL: postgres://streamlint_user:8697@localhost:5432/streamlint_db
        REDIS_URL: redis://localhost:6379/0
        CORS_ORIGINS: http://localhost:5173 
      run: |
        cd backend
        python manage.py check